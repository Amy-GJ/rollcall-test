<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機點名測試</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:480px;margin:40px auto;padding:20px;background:#f5f7fa;color:#172033}select,button{font-size:18px;padding:14px;border-radius:12px;margin:8px 0;width:100%;box-sizing:border-box}button{background:#2459d3;color:white;border:0}#result{padding:16px;background:white;border-radius:12px;white-space:pre-wrap}</style></head><body><h1>手機點名功能測試</h1><p>此頁不含任何真實人員資料。</p><label for="task">任務狀態</label><select id="task"><option>實到</option><option>休假</option><option>受訓</option></select><button id="test">測試按鈕</button><button id="copy">複製測試文字</button><p id="result">尚未測試</p><script>document.getElementById('test').addEventListener('click',function(){document.getElementById('result').textContent='成功！選擇：'+document.getElementById('task').value});document.getElementById('copy').addEventListener('click',async function(){let s='測試回報：'+document.getElementById('task').value;try{await navigator.clipboard.writeText(s);document.getElementById('result').textContent='已複製：'+s}catch(e){document.getElementById('result').textContent='無法自動複製，請長按以下文字複製：\n'+s}})</script></body></html>
